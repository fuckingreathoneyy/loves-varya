<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя Варя</title>
  <style>
    body {
      background: #1a1a1a;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #FFC0CB;
      font-size: 48px;
    }
    p {
      font-size: 20px;
      color: #aaa;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      max-width: 1000px;
      margin: 50px auto;
    }
    .disk {
      display: block;
      transition: transform 0.3s;
    }
    .disk:hover {
      transform: scale(1.1);
    }
    .disk img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Варя <3</h1>
  <p>Моя любовь с 2022 года.</p>
  <img src="свидетельство.png" alt="Самая лучшая">
